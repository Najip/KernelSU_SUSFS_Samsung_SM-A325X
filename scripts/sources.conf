# Upstream sources. They are cloned during the build (never stored in this repo).
# Change a *_REF to a branch, tag or commit to build something else.
#
# KERNEL_SOURCE picks the kernel tree (the workflow's "Kernel" dropdown):
#   aigis = SlamZDank/Aigis-Kernel-A32 (bpf-5.15-legion), the main kernel
#           (the Build Kernel dropdown default)
#   mzggr = mzggr0914/android_kernel_a325x_bakasu, the Alt. kernel
#           (used here when KERNEL_SOURCE is not set)
#   aigis-bakasu = the same Aigis kernel with BakaSU (Baka-SU/BakaSU, main)
#           as root instead of xxKSU (the workflow's "Root flavor" BakaSU)
#
# ROOT_FLAVOR (set here from KERNEL_SOURCE): xxksu or bakasu.
KERNEL_SOURCE=${KERNEL_SOURCE:-mzggr}
ROOT_FLAVOR=xxksu
if [[ "$KERNEL_SOURCE" == aigis-bakasu ]]; then
  ROOT_FLAVOR=bakasu
  KERNEL_BASE_PATCH=${KERNEL_BASE_PATCH:-base/0001-aigis-legion-to-bakasu-susfs.patch}
fi
case "${KERNEL_SOURCE%-bakasu}" in
  mzggr)
    KERNEL_REPO=${KERNEL_REPO:-https://github.com/mzggr0914/android_kernel_a325x_bakasu}
    KERNEL_REF=${KERNEL_REF:-common}
    KERNEL_BASE_PATCH=${KERNEL_BASE_PATCH:-base/0001-mzggr-common-to-xxksu-susfs.patch}
    KERNEL_LABEL=${KERNEL_LABEL:-A325X-mzggr}
    TUNING_SUPPORTED=${TUNING_SUPPORTED:-true}
    # Always AOSP Clang 14 + ld.lld + GNU as, as before.
    KERNEL_TOOLCHAIN=aosp
    # The Valhall GPU tick is for Aigis only.
    VALHALL_GPU=false
    KERNEL_GPU_PATCH=
    AK3_FROM_TREE=
    AK3_DTB_BOOTIMG=
    VALHALL_DRIVERS_URL=
    # Config fragments from the kernel tree, merged in this order (same as the
    # booting Najip/android_kernel_a325F_bakasu xxksu build).
    KERNEL_FRAGMENTS=${KERNEL_FRAGMENTS:-"mt6768_slm_defconfig a32.config battery.config ksu-a325n-common.config a325n-release.config"}
    ;;
  aigis)
    # Aigis kernel by SlamZDank, default branch bpf-5.15-legion (BPF
    # backports + Android 15+ netbpfload uname workaround). The base patch adds
    # the SUSFS hooks of its bpf-5.15-legion-susfs branch (only those files)
    # and converts the tree to xxKSU + Jack's SUSFS core.
    KERNEL_REPO=${KERNEL_REPO:-https://github.com/SlamZDank/Aigis-Kernel-A32}
    KERNEL_REF=${KERNEL_REF:-bpf-5.15-legion}
    KERNEL_BASE_PATCH=${KERNEL_BASE_PATCH:-base/0001-aigis-legion-to-xxksu-susfs.patch}
    KERNEL_LABEL=${KERNEL_LABEL:-A325X-Aigis}
    # Aigis ships its own CPU/GPU tuning; our tuning patch is for the mzggr tree.
    # A tuning request is ignored here (prepare_sources.sh warns), never applied.
    TUNING_SUPPORTED=false
    # Compiler (AIGIS_COMPILER, the "Aigis compiler" dropdown):
    #  aigis (default) = ZyC Clang 14.0.6 like the Aigis CI: its gcc wrappers,
    #        plain make (no LLVM=1), KCFLAGS=' -w -pipe -O3'.
    #  main = pinned AOSP Clang 14 (clang-r450784d), LLVM=1, ld.lld, GNU as.
    if [[ "${AIGIS_COMPILER:-aigis}" == main ]]; then KERNEL_TOOLCHAIN=aosp; else KERNEL_TOOLCHAIN=zyc; fi
    # zyc only: lld = ZyC ld.lld (like the published Aigis kernels), gnu = GNU ld
    KERNEL_LINKER=${KERNEL_LINKER:-lld}
    # Packaged with the tree's own AnyKernel folder, Image only.
    AK3_FROM_TREE=${AK3_FROM_TREE:-AnyKernel}
    # GPU, picked by VALHALL_GPU (the "Valhall GPU" tick, default on):
    #  false = the stock A32 stack from the mzggr kernel (Mali Bifrost r25p0,
    #          stock GPU clocks/voltages, stock GED) through
    #          patches/base/0002-aigis-stock-gpu.patch; the phone's own dtb is kept.
    #  true  = the Aigis Valhall r32p1 setup with Aigis's own GPU tuning: the
    #          r32p1 dtb from their a32-r32p1-slm-boot.img (checked by SHA256) is
    #          put in the zip, and a second -valhall zip also installs their
    #          Valhall drivers KernelSU module.
    VALHALL_GPU=${VALHALL_GPU:-false}
    AK3_DTB_BOOTIMG_SHA256=${AK3_DTB_BOOTIMG_SHA256:-e5de47e463fcc7d29ff7721e1a45f46a0e3b626a3af01dd3d5966f0c3b92094f}
    AK3_DTB_SHA256=${AK3_DTB_SHA256:-74a33ce244eb8d0e8d777c7760bdad620f94afb7eb56c242bfb1962fd85f1afc}
    VALHALL_DRIVERS_SHA256=${VALHALL_DRIVERS_SHA256:-141537cb3031d78dc91a2242f68d0a9ff488b9ee4e9eb6a10ab76664acae137c}
    if [[ "$VALHALL_GPU" == true ]]; then
      KERNEL_GPU_PATCH=
      AK3_DTB_BOOTIMG=${AK3_DTB_BOOTIMG:-https://github.com/SlamZDank/Aigis-Kernel-A32/releases/download/GPU-Update/a32-r32p1-slm-boot.img}
      VALHALL_DRIVERS_URL=${VALHALL_DRIVERS_URL:-https://github.com/SlamZDank/Aigis-Kernel-A32/releases/download/GPU-Update/A32-Mali-Valhall-Drivers-KSU-Module.zip}
      gpu_fragment=
    else
      KERNEL_GPU_PATCH=${KERNEL_GPU_PATCH-base/0002-aigis-stock-gpu.patch}
      AK3_DTB_BOOTIMG=
      VALHALL_DRIVERS_URL=
      gpu_fragment=" aigis-stock-gpu.config"
    fi
    # The Aigis defconfig used by its own build_kernel.sh, then the xxKSU block
    # added by the base patch, then (stock GPU only) the GPU selection.
    if [[ "$ROOT_FLAVOR" == bakasu ]]; then
      # BakaSU + SUSFS inline hooks (from bpf-5.15-legion-susfs), see the patch.
      KERNEL_FRAGMENTS=${KERNEL_FRAGMENTS:-"a32_slamzdank_defconfig bakasu-aigis.config$gpu_fragment"}
    else
      KERNEL_FRAGMENTS=${KERNEL_FRAGMENTS:-"a32_slamzdank_defconfig xxksu-aigis.config$gpu_fragment"}
    fi
    ;;
  *) echo "Unknown KERNEL_SOURCE '$KERNEL_SOURCE' (use mzggr, aigis or aigis-bakasu)" >&2; return 1 2>/dev/null || exit 1 ;;
esac
if [[ "$TUNING_SUPPORTED" != true && "${PERF_TUNING:-false}" == true ]]; then
  TUNING_IGNORED=true
  PERF_TUNING=false
fi
# Root module. xxKSU for aigis / mzggr, BakaSU for aigis-bakasu.
#   BakaSU branch: main by default (the "BakaSU branch" box of Build Kernel).
BAKASU_BRANCH=${BAKASU_BRANCH:-main}
if [[ "$ROOT_FLAVOR" == bakasu ]]; then
  ROOT_NAME=BakaSU
  KSU_REPO=${KSU_REPO:-https://github.com/Baka-SU/BakaSU}
  KSU_REF=${KSU_REF:-$BAKASU_BRANCH}
else
  ROOT_NAME=xxKSU
  KSU_REPO=${KSU_REPO:-https://github.com/Najip/xxKSU}
  KSU_REF=${KSU_REF:-sync-mojito}
fi
SUSFS_REPO=${SUSFS_REPO:-https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd}
SUSFS_REF=${SUSFS_REF:-mainline}
SUSFS_PATCH=${SUSFS_PATCH:-Patches/Patch/susfs_patch_to_4.14.patch}
NOMOUNT_REPO=${NOMOUNT_REPO:-https://github.com/maxsteeel/nomount}
LKMLOADER_REPO=${LKMLOADER_REPO:-https://github.com/maxsteeel/lkmloader}
AK3_REPO=${AK3_REPO:-https://github.com/osm0sis/AnyKernel3}
AK3_COMMIT=${AK3_COMMIT:-af770f7b16cf8f8eb7c68614b2a693b3b361c90c}
