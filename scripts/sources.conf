# Upstream sources. They are cloned during the build (never stored in this repo).
# Change a *_REF to a branch, tag or commit to build something else.
# Test branch: Aigis kernel by SlamZDank, default branch bpf-5.15-legion (BPF
# backports + Android 15+ netbpfload uname workaround, Valhall GPU driver).
# The base patch adds the SUSFS hooks of its bpf-5.15-legion-susfs branch
# (only those files) and converts the tree to xxKSU + Jack's SUSFS core.
KERNEL_REPO=${KERNEL_REPO:-https://github.com/SlamZDank/Aigis-Kernel-A32}
KERNEL_REF=${KERNEL_REF:-bpf-5.15-legion}
# Patch that turns the tree into the xxKSU + SUSFS layout, and the zip name label.
KERNEL_BASE_PATCH=${KERNEL_BASE_PATCH:-base/0001-aigis-legion-to-xxksu-susfs.patch}
KERNEL_LABEL=${KERNEL_LABEL:-A325X-Aigis}
# Aigis ships its own CPU/GPU frequency tables; our tuning patch is for the mz tree.
TUNING_SUPPORTED=${TUNING_SUPPORTED:-false}
# Build like the Aigis CI: ZyC Clang 14.0.6 with its gcc wrappers, plain make
# (no LLVM=1), KCFLAGS=' -w -pipe -O3', and the tree's own AnyKernel folder
# with only Image in it.
KERNEL_TOOLCHAIN=${KERNEL_TOOLCHAIN:-zyc}
AK3_FROM_TREE=${AK3_FROM_TREE:-AnyKernel}
# Bootloop fix from the Aigis GPU-Update / upstream-update-3 releases: the
# Valhall (Mali r32p1) driver needs the matching dtb in the boot partition.
# Its dtb is taken from their a32-r32p1-slm-boot.img (checked by SHA256) and
# put in the zip as "dtb", so AnyKernel writes it together with the kernel.
# Set AK3_DTB_BOOTIMG= (empty) to keep the phone's current dtb.
AK3_DTB_BOOTIMG=${AK3_DTB_BOOTIMG-https://github.com/SlamZDank/Aigis-Kernel-A32/releases/download/GPU-Update/a32-r32p1-slm-boot.img}
AK3_DTB_BOOTIMG_SHA256=${AK3_DTB_BOOTIMG_SHA256:-e5de47e463fcc7d29ff7721e1a45f46a0e3b626a3af01dd3d5966f0c3b92094f}
AK3_DTB_SHA256=${AK3_DTB_SHA256:-74a33ce244eb8d0e8d777c7760bdad620f94afb7eb56c242bfb1962fd85f1afc}
# Valhall user-space drivers (KernelSU module) for ROMs whose vendor lacks them.
VALHALL_DRIVERS_URL=${VALHALL_DRIVERS_URL:-https://github.com/SlamZDank/Aigis-Kernel-A32/releases/download/GPU-Update/A32-Mali-Valhall-Drivers-KSU-Module.zip}
KSU_REPO=${KSU_REPO:-https://github.com/backslashxx/KernelSU}
KSU_REF=${KSU_REF:-master}
SUSFS_REPO=${SUSFS_REPO:-https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd}
SUSFS_REF=${SUSFS_REF:-mainline}
SUSFS_PATCH=${SUSFS_PATCH:-Patches/Patch/susfs_patch_to_4.14.patch}
NOMOUNT_REPO=${NOMOUNT_REPO:-https://github.com/maxsteeel/nomount}
LKMLOADER_REPO=${LKMLOADER_REPO:-https://github.com/maxsteeel/lkmloader}
AK3_REPO=${AK3_REPO:-https://github.com/osm0sis/AnyKernel3}
AK3_COMMIT=${AK3_COMMIT:-af770f7b16cf8f8eb7c68614b2a693b3b361c90c}
# Config fragments from the kernel tree, merged in this order: the Aigis
# defconfig used by its own build_kernel.sh, then the xxKSU block added by the
# base patch.
KERNEL_FRAGMENTS=${KERNEL_FRAGMENTS:-"a32_slamzdank_defconfig xxksu-aigis.config"}
