# Upstream sources. They are cloned during the build (never stored in this repo).
# Change a *_REF to a branch, tag or commit to build something else.
# Test branch: Aigis kernel by SlamZDank (bpf-5.15-legion-susfs: BPF backports
# + Android 15+ netbpfload uname workaround, BakaSU + SUSFS hook layout).
KERNEL_REPO=${KERNEL_REPO:-https://github.com/SlamZDank/Aigis-Kernel-A32}
KERNEL_REF=${KERNEL_REF:-bpf-5.15-legion-susfs}
# Patch that turns the tree into the xxKSU + SUSFS layout, and the zip name label.
KERNEL_BASE_PATCH=${KERNEL_BASE_PATCH:-base/0001-aigis-susfs-to-xxksu-susfs.patch}
KERNEL_LABEL=${KERNEL_LABEL:-A325X-Aigis}
# Aigis ships its own CPU/GPU frequency tables; our tuning patch is for the mz tree.
TUNING_SUPPORTED=${TUNING_SUPPORTED:-false}
# Same compiler flags as Aigis's own build_kernel.sh: -w hides the vendor
# code warnings that its subdirectories would otherwise turn into errors.
KERNEL_KCFLAGS=${KERNEL_KCFLAGS:-"-w -pipe -O3"}
KERNEL_KCPPFLAGS=${KERNEL_KCPPFLAGS:-"-O3"}
KSU_REPO=${KSU_REPO:-https://github.com/backslashxx/KernelSU}
KSU_REF=${KSU_REF:-master}
SUSFS_REPO=${SUSFS_REPO:-https://github.com/JackA1ltman/NonGKI_Kernel_Build_2nd}
SUSFS_REF=${SUSFS_REF:-mainline}
SUSFS_PATCH=${SUSFS_PATCH:-Patches/Patch/susfs_patch_to_4.14.patch}
NOMOUNT_REPO=${NOMOUNT_REPO:-https://github.com/maxsteeel/nomount}
LKMLOADER_REPO=${LKMLOADER_REPO:-https://github.com/maxsteeel/lkmloader}
AK3_REPO=${AK3_REPO:-https://github.com/osm0sis/AnyKernel3}
AK3_COMMIT=${AK3_COMMIT:-af770f7b16cf8f8eb7c68614b2a693b3b361c90c}
# Config fragments from the kernel tree, merged in this order: the Aigis
# defconfig used by its own build_kernel.sh, then the xxKSU block added by the
# base patch.
KERNEL_FRAGMENTS=${KERNEL_FRAGMENTS:-"a32_slamzdank_defconfig xxksu-aigis.config"}
