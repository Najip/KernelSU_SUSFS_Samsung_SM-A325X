name: Upstream check
run-name: Upstream check${{ github.event_name == 'workflow_dispatch' && ' (manual)' || '' }}

# Three times a day: did the Aigis kernel, the mzggr kernel, xxKSU, BakaSU
# (sync-up, or the branch set by "Switch BakaSU branch"), Jack's SUSFS 4.14
# patch or NoMount (master only) get new commits since the last
# check? The newest commits seen are saved in configs/upstream-state.json on
# the default branch. When something is new, only that is rebuilt (commit mode
# Latest, release type Pre-release, NoMount master), in one Build Kernel run
# with every file (Kernel both, Root flavor All): xxKSU = the xxKSU kernels,
# BakaSU = Aigis BakaSU, SUSFS = all kernels, one kernel tree = that kernel,
# NoMount = only the NoMount modules; the rest comes from an earlier run.
on:
  schedule:
    # 07:00, 15:00 and 23:00 in Jakarta (UTC+7)
    - cron: '0 0,8,16 * * *'
  workflow_dispatch:
    inputs:
      build:
        description: 'Start the CI build when something changed (untick = only check and save)'
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

env:
  GH_TOKEN: ${{ github.token }}
  # Branch the CI build runs on (it needs the Kernel "both" option). Set the
  # repo variable UPSTREAM_BUILD_REF to change it; when that branch no longer
  # exists, the default branch is used.
  BUILD_REF: ${{ vars.UPSTREAM_BUILD_REF || github.event.repository.default_branch }}
  STATE: configs/upstream-state.json

jobs:
  check:
    name: Check upstream sources
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ${{ github.event.repository.default_branch }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1

      - name: Use the sources of the build branch
        run: |
          set -euo pipefail
          if ! git fetch -q --depth=1 origin "$BUILD_REF" 2>/dev/null; then
            echo "::notice::Branch $BUILD_REF not found, using ${{ github.event.repository.default_branch }}."
            BUILD_REF=${{ github.event.repository.default_branch }}
            git fetch -q --depth=1 origin "$BUILD_REF"
          fi
          echo "BUILD_REF=$BUILD_REF" >> "$GITHUB_ENV"
          git show FETCH_HEAD:scripts/sources.conf > "$RUNNER_TEMP/sources.conf"
          git show FETCH_HEAD:scripts/upstream_check.py > "$RUNNER_TEMP/upstream_check.py" 2>/dev/null \
            || cp scripts/upstream_check.py "$RUNNER_TEMP/upstream_check.py"
          echo "Build branch: $BUILD_REF"

      - name: Compare with the last check
        id: check
        run: python3 "$RUNNER_TEMP/upstream_check.py" "$RUNNER_TEMP/sources.conf" "$STATE"

      - name: Start the Pre-release build of what changed
        id: build
        if: steps.check.outputs.changed == 'true' && steps.check.outputs.plan != '{}' && (github.event_name == 'schedule' || inputs.build)
        # One Build Kernel run (Pre-release, NoMount master): only what changed is
        # rebuilt (plan.json), the other files are taken from an earlier run.
        run: python3 "$RUNNER_TEMP/upstream_check.py" start "$STATE" plan.json "$GITHUB_REPOSITORY" "$BUILD_REF"

      - name: Summary
        run: |
          {
            if [[ "${{ steps.check.outputs.first }}" == true ]]; then
              echo "### First check: commits saved, nothing to compare yet"
            elif [[ "${{ steps.check.outputs.changed }}" == true ]]; then
              echo "## New upstream commits"
              cat changes.md
              if [[ "${{ steps.build.conclusion }}" == success ]]; then
                echo "## Pre-release build started (NoMount master)"
                echo "Only what changed is rebuilt on $BUILD_REF; the rest is taken from the earlier run."
                echo
                cat builds.md
              else
                echo "No build started (manual check with Build unticked)."
              fi
            else
              echo "### No new upstream commits"
            fi
            if [[ -s bakasu-merged.md ]]; then
              echo
              cat bakasu-merged.md
            fi
            if [[ -s ignored.md ]]; then
              echo
              echo "## Ignored commits (no build)"
              cat ignored.md
            fi
            echo
            cat sources.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the commits seen
        if: steps.check.outputs.changed == 'true' || steps.check.outputs.moved == 'true' || steps.check.outputs.first == 'true'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp "$STATE" "$RUNNER_TEMP/state.json"
          branch=${{ github.event.repository.default_branch }}
          for attempt in 1 2 3; do
            git fetch -q origin "$branch" && git reset -q --hard FETCH_HEAD
            mkdir -p "$(dirname "$STATE")"
            cp "$RUNNER_TEMP/state.json" "$STATE"
            git add "$STATE"
            if git diff --cached --quiet; then echo 'State already saved.'; exit 0; fi
            git commit -q -m "Upstream check: ${{ steps.check.outputs.changed_list || (steps.check.outputs.first == 'true' && 'first check' || 'only ignored kernel commits') }}"
            git push -q origin "HEAD:$branch" && exit 0
            sleep 5
          done
          echo '::error::Could not save the upstream state.'; exit 1
