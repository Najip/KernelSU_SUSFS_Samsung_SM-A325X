name: Build Kernel
run-name: A325X xxKSU + SUSFS kernel [${{ inputs.ksu_hook }}]${{ inputs.perf_tuning && ' (tuning)' || '' }} (${{ inputs.commit_mode }})${{ inputs.release_type != 'CI' && format(' + {0}', inputs.release_type) || '' }}${{ github.ref_name != 'main' && format(' [{0}]', github.ref_name) || '' }}

# Run it: Actions -> Build Kernel -> Run workflow.
# Every source (kernel, xxKSU, SUSFS patch) is downloaded fresh during the run.
on:
  workflow_dispatch:
    inputs:
      self_hosted:
        description: 'Prefer my own PC (self-hosted). If it is busy, a GitHub runner is used when that finishes sooner. Untick = GitHub runner'
        type: boolean
        default: true
      ksu_hook:
        description: 'xxKSU hook style. branch_link = xxKSU rewrites the call instructions (default). manual = kernel calls xxKSU directly. syscall_table = xxKSU swaps the syscall table entries'
        type: choice
        options:
          - branch_link
          - manual
          - syscall_table
        default: branch_link
      perf_tuning:
        description: 'Performance tuning (GPU 1100 MHz, CPU/CCI undervolt, BORE, 250 Hz, schedutil, fast charge, zstd zram, BBR, fq_codel). The network fix is always applied'
        type: boolean
        default: false
      commit_mode:
        description: 'Which commits to build. Latest = newest of every source (testing). Verified = the pinned commits saved by Promoted (required for a full Release). Promoted = build the newest and, if it succeeds, save those commits as Verified'
        type: choice
        options:
          - Latest
          - Verified
          - Promoted
        default: Latest
      release_type:
        description: 'CI = build only, no release. Pre-release = publish as a pre-release. Release = publish a full release (only allowed with Verified) and update the README sources table'
        type: choice
        options:
          - CI
          - Pre-release
          - Release
        default: CI

permissions:
  contents: read
  actions: read


env:
  PERF_TUNING: ${{ inputs.perf_tuning }}
  KSU_HOOK: ${{ inputs.ksu_hook || 'branch_link' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/pick_runner.py
            scripts/resolve_commits.py
            scripts/sources.conf
          sparse-checkout-cone-mode: false
      - name: Choose self-hosted PC or GitHub runner
        id: pick
        env:
          WANT_SELF_HOSTED: ${{ inputs.self_hosted }}
        run: python3 scripts/pick_runner.py
      - name: Resolve source commits
        id: commits
        env:
          COMMIT_MODE: ${{ inputs.commit_mode }}
        run: python3 scripts/resolve_commits.py resolve
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      kernel_ref: ${{ steps.commits.outputs.kernel_ref }}
      ksu_ref: ${{ steps.commits.outputs.ksu_ref }}
      susfs_ref: ${{ steps.commits.outputs.susfs_ref }}
      kernel_branch: ${{ steps.commits.outputs.kernel_branch }}
      ksu_branch: ${{ steps.commits.outputs.ksu_branch }}
      susfs_branch: ${{ steps.commits.outputs.susfs_branch }}

  build:
    name: Build xxKSU + SUSFS kernel
    needs: pick
    runs-on: ${{ needs.pick.outputs.runner }}
    env:
      SELF_HOSTED: ${{ needs.pick.outputs.runner == 'self-hosted' }}
      KERNEL_REF: ${{ needs.pick.outputs.kernel_ref }}
      KSU_REF: ${{ needs.pick.outputs.ksu_ref }}
      SUSFS_REF: ${{ needs.pick.outputs.susfs_ref }}
      KERNEL_BRANCH: ${{ needs.pick.outputs.kernel_branch }}
      KSU_BRANCH: ${{ needs.pick.outputs.ksu_branch }}
      SUSFS_BRANCH: ${{ needs.pick.outputs.susfs_branch }}
    timeout-minutes: 180
    outputs:
      zip_name: ${{ steps.package.outputs.zip_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Prepare build folders
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/a325x-build.XXXXXX")
          if [[ "$SELF_HOSTED" == true ]]; then
            # Keep the kernel download between runs on the PC (saves ~1 GB per run).
            cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325x-bakasu"
            mkdir -p "$cache"
            kernel_dir="$cache/kernel-tree-${GITHUB_REF_NAME//\//-}"
          else
            kernel_dir="$work/kernel"
          fi
          {
            echo "BUILD_WORK=$work"
            echo "KERNEL_DIR=$kernel_dir"
            echo "OUT_DIR=$work/out"
            echo "INFO_DIR=$work/info"
            echo "PACKAGE_DIR=$work/package"
            echo "TOOLCHAIN=$RUNNER_TEMP/aosp-clang14"
            echo "BUILD_LOG=$work/build.log"
          } >> "$GITHUB_ENV"
          df -h "$RUNNER_TEMP"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          packages=(bc binutils-aarch64-linux-gnu bison pahole build-essential ca-certificates cpio curl file flex git libelf-dev libssl-dev libncurses-dev lz4 patch python3 unzip xz-utils zip zlib1g-dev zstd util-linux)
          if [[ "$SELF_HOSTED" != true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
            exit 0
          fi
          fail() { echo "::error::$*" >&2; exit 1; }
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then
              sudo -n true || fail "Missing packages (run: sudo apt install ${missing[*]})"
              privilege=(sudo -n)
            fi
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends --no-remove "${missing[@]}"
          else
            echo 'All build dependencies are already installed.'
          fi

      - name: Use cached AOSP Clang 14 (own PC)
        if: env.SELF_HOSTED == 'true'
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel/xxksu"
          mkdir -p "$cache"
          exec 9>"$cache/.lock"
          flock 9
          key=$(sha256sum scripts/fetch_aosp_clang.sh scripts/aosp_clang14.conf | sha256sum | cut -c1-16)
          toolchain="$cache/aosp-clang14-$key"
          AOSP_CLANG_CACHE="$cache/archives" sh scripts/fetch_aosp_clang.sh "$toolchain"
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Download sources and apply patches
        run: |
          set -euo pipefail
          bash scripts/prepare_sources.sh 2>&1 | tee "$BUILD_LOG"
          python3 - <<'EOF'
          import json, os, subprocess
          p = os.path.join(os.environ["INFO_DIR"], "sources.json")
          d = json.load(open(p))
          d["build_repo"] = {
              "repo": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}",
              "ref": os.environ["GITHUB_REF_NAME"], "commit": os.environ["GITHUB_SHA"],
              "subject": subprocess.check_output(["git", "show", "-s", "--format=%s", "HEAD"], text=True).strip(),
          }
          json.dump(d, open(p, "w"), indent=2)
          EOF

      - name: Compile kernel
        run: |
          set -euo pipefail
          bash scripts/build_kernel.sh 2>&1 | tee -a "$BUILD_LOG"

      - name: Make flashable ZIP
        id: package
        run: |
          set -euo pipefail
          bash scripts/package_zip.sh 2>&1 | tee -a "$BUILD_LOG"
          name=$(cat "$PACKAGE_DIR/zip-name.txt")
          echo "zip_name=$name" >> "$GITHUB_OUTPUT"
          echo "ZIP_PATH=$PACKAGE_DIR/$name.zip" >> "$GITHUB_ENV"
          {
            echo "### Flashable ZIP: \`$name.zip\`"
            echo '```'
            cat "$PACKAGE_DIR/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build hook benchmark
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_WORK/bench"
          "$TOOLCHAIN/bin/clang" --target=aarch64-linux-gnu -O2 -static -nostdlib -ffreestanding \
            -fno-stack-protector -fno-builtin -fno-pic -fuse-ld=lld -Wl,--build-id=none -Wl,-z,norelro \
            -o "$BUILD_WORK/bench/hook-bench" tools/hook-bench.c
          cp tools/hook-bench.sh "$BUILD_WORK/bench/"
          echo "BENCH_DIR=$BUILD_WORK/bench" >> "$GITHUB_ENV"

      - name: Upload flashable ZIP
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build-info.txt
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.PACKAGE_DIR }}/build-info.txt
          archive: false
          retention-days: 30

      - name: Upload hook benchmark
        uses: actions/upload-artifact@v7
        with:
          name: hook-bench
          path: ${{ env.BENCH_DIR }}
          retention-days: 30

      - name: Keep files for the release job
        if: inputs.release_type != 'CI' || inputs.commit_mode == 'Promoted'
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.PACKAGE_DIR }}/build-info.txt
            ${{ env.PACKAGE_DIR }}/sources.json
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
          retention-days: 3

      - name: Upload logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}
          include-hidden-files: true
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.OUT_DIR }}/System.map
            ${{ env.OUT_DIR }}/toolchain-source.txt
            ${{ env.INFO_DIR }}/sources.json
            ${{ env.INFO_DIR }}/applied-patches.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build folder (own PC)
        if: always() && env.SELF_HOSTED == 'true'
        run: |
          if [[ -n "${BUILD_WORK:-}" && "$BUILD_WORK" == "$RUNNER_TEMP"/a325x-build.* ]]; then
            rm -rf -- "$BUILD_WORK"
          fi

  release:
    name: Publish release and update README
    needs: [pick, build]
    if: inputs.release_type != 'CI'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Check the release is allowed
        run: |
          set -euo pipefail
          if [[ "${{ inputs.release_type }}" == Release && "${{ inputs.commit_mode }}" != Verified ]]; then
            echo "::error::Release must use Verified. Latest and Promoted can only publish a Pre-release. Choose commit mode Verified, or pick Pre-release."
            exit 1
          fi
          echo "Publishing a ${{ inputs.release_type }} from commit mode ${{ inputs.commit_mode }}."

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Install build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bc binutils-aarch64-linux-gnu bison pahole build-essential ca-certificates cpio curl file flex git libelf-dev libssl-dev libncurses-dev lz4 patch python3 unzip xz-utils zip zlib1g-dev zstd util-linux

      - name: Set up Zig
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Build the matching NoMount dev module
        run: |
          set -euo pipefail
          # Same commits, hook style and tuning as the kernel in this release.
          export KERNEL_REF='${{ needs.pick.outputs.kernel_ref }}'
          export KSU_REF='${{ needs.pick.outputs.ksu_ref }}'
          export SUSFS_REF='${{ needs.pick.outputs.susfs_ref }}'
          export KERNEL_BRANCH='${{ needs.pick.outputs.kernel_branch }}'
          export KSU_BRANCH='${{ needs.pick.outputs.ksu_branch }}'
          export SUSFS_BRANCH='${{ needs.pick.outputs.susfs_branch }}'
          export KSU_HOOK='${{ inputs.ksu_hook }}'
          export PERF_TUNING='${{ inputs.perf_tuning }}'
          export NOMOUNT_REF=dev
          bash scripts/build_nomount.sh release

      - name: Write release notes
        run: |
          set -euo pipefail
          ls -l release
          # main: build-YYYYMMDD-N. Other branches: <branch>-YYYYMMDD-N (pre-release),
          # so every branch has its own release history and "what's new".
          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then prefix=build; else prefix=${BRANCH//\//-}; fi
          tag="$prefix-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName \
            --jq "[.[].tagName | select(test(\"^$prefix-[0-9]{8}-[0-9]+\$\"))][0] // \"\"")
          if [[ -n "$prev" ]] && gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern sources.json --dir prev 2>/dev/null; then
            echo "Previous release: $prev"
            prev_json=prev/sources.json
          else
            echo "No previous release with sources.json; this is the first one."
            prev_json=-
          fi
          python3 scripts/release_notes.py notes release/sources.json "$prev_json" release/build-info.txt notes.md

      - name: Publish release
        run: |
          set -euo pipefail
          zip=$(ls release/A325X-*.zip)
          name=$(basename "$zip" .zip)
          shopt -s nullglob
          ko=(release/*.ko)
          ((${#ko[@]})) || { echo "::error::The NoMount module (.ko) was not built."; ls -l release; exit 1; }
          assets=(release/*.zip release/*.ko release/build-info.txt release/sources.json release/SHA256SUMS.txt)
          ((${#assets[@]})) || { echo '::error::No files to attach to the release.'; exit 1; }
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$name" --notes-file notes.md \
            $([[ "${{ inputs.release_type }}" == Release ]] || echo --prerelease)

      - name: Update README sources table
        if: inputs.release_type == 'Release'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            python3 scripts/release_notes.py readme release/sources.json README.md "$TAG"
            if git diff --quiet; then echo 'README already up to date.'; exit 0; fi
            git commit -q -am "README: sources for release $TAG"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not push the README update.'; exit 1

  promote:
    name: Save verified commits
    needs: build
    if: inputs.commit_mode == 'Promoted'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download the built sources
        uses: actions/download-artifact@v8
        with:
          name: release-files
          path: release

      - name: Pin the commits that built
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            python3 scripts/resolve_commits.py promote release/sources.json configs/verified.json
            if git diff --quiet; then echo 'Verified commits already match this build.'; exit 0; fi
            git commit -q -am "Verified commits: promote run ${GITHUB_RUN_NUMBER}"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not save the verified commits.'; exit 1
