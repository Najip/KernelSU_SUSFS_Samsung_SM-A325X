name: Build Kernel
run-name: ${{ inputs.release_type == 'Release from pre-release' && format('A325X publish {0} as Release', inputs.pre_release != '' && inputs.pre_release || 'the newest pre-release') || '' }}${{ inputs.release_type != 'Release from pre-release' && (inputs.commit_mode == 'Promoted' && 'A325X promote the newest default Latest build' || (inputs.nomount_only && format('A325X NoMount {0} LKM only', inputs.nomount_branch) || 'A325X BakaSU + SUSFS kernel')) || '' }} (Aigis)${{ inputs.bakasu_branch != '' && inputs.bakasu_branch != 'main' && format(' (BakaSU {0})', inputs.bakasu_branch) || '' }}${{ inputs.commit_mode != 'Promoted' && !inputs.network_fix && ' (no network fix)' || '' }}${{ inputs.commit_mode != 'Promoted' && inputs.valhall_gpu && ' (Valhall GPU)' || '' }}${{ inputs.commit_mode != 'Promoted' && inputs.compiler == 'main' && ' (main compiler)' || '' }} (${{ inputs.commit_mode }})${{ inputs.reuse != '' && ' (upstream)' || '' }}${{ format(' NoMount {0}-{1}', inputs.nomount, inputs.nomount_branch) }}${{ inputs.release_type != 'CI' && inputs.release_type != 'Release from pre-release' && format(' + {0}', inputs.release_type) || '' }}${{ github.ref_name != 'main' && format(' [{0}]', github.ref_name) || '' }}

# Run it: Actions -> Build Kernel -> Run workflow.
# Every source (Aigis kernel, BakaSU, SUSFS patch, NoMount) is downloaded fresh during the run.
# Only the main kernel (Aigis) with BakaSU is built here. xxKSU was archived by
# its developer on 22 Nov 2026; the xxKSU builds and the Alt. kernel (mzggr)
# are kept, frozen, in the xxksu branch.
on:
  workflow_dispatch:
    inputs:
      bakasu_branch:
        description: 'BakaSU branch. main = default'
        type: string
        default: main
      self_hosted:
        description: 'Prefer my own PC (self-hosted). If it is busy, a GitHub runner is used when that finishes sooner. Untick = GitHub runner'
        type: boolean
        default: true
      network_fix:
        description: 'Network fix (UDP-only GSO for IPv4 and IPv6). Allowed with every release type'
        type: boolean
        default: true
      uname_tag:
        description: 'Text added to the end of uname -r (letters, digits, space, . _ + -; no /). Empty = none'
        type: string
        default: '-forkby-gh.Najip'
      valhall_gpu:
        description: 'Valhall GPU, default ticked and allowed with every release type (Aigis r32p1 GPU code, r32p1 dtb, one zip with the kernel and the drivers module bundled). Unticked = stock A32 GPU'
        type: boolean
        default: true
      compiler:
        description: 'Compiler. aigis = ZyC Clang 14.0.6 the Aigis CI way (default). main = AOSP Clang 14'
        type: choice
        options:
          - aigis
          - main
        default: aigis
      nomount:
        description: 'NoMount. lkm = module built for this kernel, inside the kernel ZIP and also as a separate ZIP + .ko (default). integrate = built into the kernel'
        type: choice
        options:
          - lkm
          - integrate
        default: lkm
      nomount_branch:
        description: 'NoMount branch'
        type: choice
        options:
          - master
          - dev
        default: master
      nomount_only:
        description: 'Build only the NoMount module (no kernel ZIP). Uses the saved kernel kit of the same kernel when there is one, otherwise compiles the kernel to match it'
        type: boolean
        default: false
      commit_mode:
        description: 'Which commits to use. Latest = newest of every source (testing). Verified = the pinned commits saved by Promoted (required for release type Release; Release from pre-release takes any pre-release). Promoted = no kernel rebuild: take the newest Latest run with the default kernel options and save its commits as Verified'
        type: choice
        options:
          - Latest
          - Verified
          - Promoted
        default: Latest
      release_type:
        description: 'CI = build only, no release. Pre-release = publish as a pre-release. Release = publish a full release (only allowed with Verified) and update the README sources table. Release from pre-release = no build: turn a pre-release into the full Release (same ZIPs you tested, any commit mode, Verified not needed). Which one: the Pre-release tag box, empty = newest'
        type: choice
        options:
          - CI
          - Pre-release
          - Release
          - Release from pre-release
        default: CI
      pre_release:
        description: 'Pre-release tag for Release from pre-release, for example build-20261124-120. Empty = the newest pre-release of this branch. Ignored otherwise'
        type: string
        default: ''
      reuse:
        description: 'Leave empty for a normal build (the Upstream check fills it itself). Paste a run link (or its number) = keep the kernel ZIP of that run, and its NoMount module too when it has one from the chosen NoMount branch (else a new one is built). nomount <run link> = always build a new NoMount module. Needs commit mode Latest'
        type: string
        default: ''

permissions:
  contents: read
  actions: read


env:
  BAKASU_BRANCH: ${{ inputs.bakasu_branch || 'main' }}
  VALHALL_GPU: ${{ inputs.valhall_gpu }}
  AIGIS_COMPILER: ${{ inputs.compiler || 'aigis' }}
  NETWORK_FIX: ${{ inputs.network_fix }}
  KERNEL_TAG: ${{ inputs.uname_tag }}
  NOMOUNT_MODE: ${{ inputs.nomount || 'lkm' }}
  NOMOUNT_REF: ${{ inputs.nomount_branch || 'master' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/pick_runner.py
            scripts/plan_build.py
            scripts/resolve_commits.py
            scripts/promoted_source.py
            scripts/kernel_kit.py
            scripts/sources.conf
            configs/verified.json
          sparse-checkout-cone-mode: false
      - name: Check the options fit together
        env:
          MODE: ${{ inputs.commit_mode }}
          TYPE: ${{ inputs.release_type }}
          NM_ONLY: ${{ inputs.nomount_only }}
          REUSE: ${{ inputs.reuse }}
          PRE_RELEASE: ${{ inputs.pre_release }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [[ -n "$REUSE" ]]; then
            [[ "$MODE" == Latest && "$NM_ONLY" != true && "$NOMOUNT_MODE" == lkm ]] \
              || fail "reuse needs commit mode Latest, NoMount lkm and NoMount only unticked."
            [[ "$TYPE" == CI || "$TYPE" == Pre-release ]] || fail "reuse can only make a CI build or a Pre-release."
          fi
          if [[ "$TYPE" == Release && "$MODE" != Verified ]]; then
            fail "Release must use Verified. Latest and Promoted can publish a Pre-release, which can then become the full Release with 'Release from pre-release'."
          fi
          if [[ "$TYPE" == 'Release from pre-release' ]]; then
            [[ "$NM_ONLY" != true ]] || fail "NoMount only builds are not released. Untick NoMount only."
            echo "No build: ${PRE_RELEASE:-the newest pre-release} becomes the full Release (commit mode is not checked)."
            exit 0
          fi
          [[ "$BAKASU_BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || fail "BakaSU branch '$BAKASU_BRANCH': letters, digits and . _ / - only."
          git ls-remote --exit-code https://github.com/Baka-SU/BakaSU "refs/heads/$BAKASU_BRANCH" >/dev/null \
            || fail "BakaSU has no branch '$BAKASU_BRANCH'. Use main (default) or another branch of Baka-SU/BakaSU."
          if [[ "$NM_ONLY" == true ]]; then
            [[ "$NOMOUNT_MODE" == lkm ]] || fail "NoMount only needs the NoMount option lkm."
            [[ "$TYPE" == CI ]] || fail "NoMount only builds are not released. Choose CI."
            [[ "$MODE" != Promoted ]] || fail "NoMount only does not work with Promoted (Promoted already builds the module when it is missing)."
          fi
          if [[ "$MODE" == Promoted && "$NOMOUNT_MODE" == integrate ]]; then
            fail "Promoted takes the kernel of a default Latest build, where NoMount is a separate LKM. Choose lkm."
          fi
          echo "Options are fine."
      - name: Choose self-hosted PC or GitHub runner
        id: pick
        env:
          WANT_SELF_HOSTED: ${{ inputs.self_hosted }}
        run: python3 scripts/pick_runner.py
      - name: Decide what to build
        id: plan
        if: inputs.release_type != 'Release from pre-release'
        env:
          COMMIT_MODE: ${{ inputs.commit_mode }}
          NM_ONLY: ${{ inputs.nomount_only }}
          REUSE: ${{ inputs.reuse }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/plan_build.py
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build_any: ${{ steps.plan.outputs.build_any }}
      build_kernel: ${{ steps.plan.outputs.build_kernel }}
      promote_ok: ${{ steps.plan.outputs.promote_ok }}
      sources: ${{ steps.plan.outputs.sources }}
      source_run: ${{ steps.plan.outputs.source_run }}
      source_url: ${{ steps.plan.outputs.source_url }}
      checkout_sha: ${{ steps.plan.outputs.checkout_sha }}
      collect_runs: ${{ steps.plan.outputs.collect_runs }}
      collect_sources: ${{ steps.plan.outputs.collect_sources }}
      bakasu_ref: ${{ steps.plan.outputs.bakasu_ref }}
      bakasu_branch: ${{ steps.plan.outputs.bakasu_branch }}

  manager:
    name: List manager APK
    needs: pick
    outputs:
      bakasu_apk: ${{ steps.bakasu.outputs.apk }}
    if: inputs.release_type != 'Release from pre-release'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      # BakaSU has no releases for its branch builds: its manager comes from BakaSU's own
      # "Build Manager" run of the same commit as the kernel (Manager-release
      # artifact, the arm64-v8a release APK, original name).
      - name: Checkout (BakaSU manager script)
        if: needs.pick.outputs.bakasu_ref != ''
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/bakasu_manager.py
          sparse-checkout-cone-mode: false
          path: repo
      - name: Get the BakaSU manager APK of the kernel's BakaSU commit
        id: bakasu
        if: needs.pick.outputs.bakasu_ref != ''
        run: python3 repo/scripts/bakasu_manager.py "${{ needs.pick.outputs.bakasu_ref }}" "${{ needs.pick.outputs.bakasu_branch }}" bakasu
      - name: Upload ${{ steps.bakasu.outputs.apk }}
        if: steps.bakasu.outputs.apk != ''
        uses: actions/upload-artifact@v7
        with:
          path: bakasu/${{ steps.bakasu.outputs.apk }}
          archive: false
          if-no-files-found: error
          retention-days: 30
      - name: Upload manager-bakasu.json (where the BakaSU APK comes from)
        if: steps.bakasu.outputs.apk != ''
        uses: actions/upload-artifact@v7
        with:
          name: bakasu-manager-info
          path: bakasu/manager-bakasu.json
          if-no-files-found: error
          retention-days: 30

  build:
    name: ${{ matrix.source }} - ${{ matrix.build_kernel == 'true' && 'Build BakaSU + SUSFS kernel' || 'Build the NoMount module' }}
    needs: pick
    if: needs.pick.outputs.build_any == 'true'
    runs-on: ${{ needs.pick.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix) }}
    env:
      SELF_HOSTED: ${{ needs.pick.outputs.runner == 'self-hosted' }}
      KERNEL_SOURCE: ${{ matrix.source }}
      # Artifact name suffix: -aigis-bakasu (the same names as before).
      SFX: ${{ format('-{0}', matrix.source) }}
      # Kernel kit key part (always "inline" for BakaSU).
      KSU_HOOK: ${{ matrix.ksu_hook }}
      NETWORK_FIX: ${{ matrix.network_fix }}
      # Promoted: the Aigis GPU (Valhall or stock) of the Latest run.
      VALHALL_GPU: ${{ matrix.valhall_gpu }}
      # Promoted: the tag of the Latest run, so the module matches its kernel.
      KERNEL_TAG: ${{ matrix.kernel_tag }}
      BUILD_KERNEL: ${{ matrix.build_kernel }}
      BUILD_NOMOUNT: ${{ matrix.build_nomount }}
      KIT_ID: ${{ matrix.kit_id }}
      KERNEL_REF: ${{ matrix.kernel_ref }}
      KSU_REF: ${{ matrix.ksu_ref }}
      SUSFS_REF: ${{ matrix.susfs_ref }}
      KERNEL_BRANCH: ${{ matrix.kernel_branch }}
      KSU_BRANCH: ${{ matrix.ksu_branch }}
      SUSFS_BRANCH: ${{ matrix.susfs_branch }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Promoted: the same build-repo commit as the Latest run, so the module matches its kernel.
          # reuse (nomount): the build-repo commit of the run its kernel comes from.
          ref: ${{ matrix.checkout_sha || needs.pick.outputs.checkout_sha }}
          fetch-depth: 1

      - name: Prepare build folders
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/a325x-build.XXXXXX")
          if [[ "$SELF_HOSTED" == true ]]; then
            # Keep the kernel download between runs on the PC (saves ~1 GB per run).
            cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325x-bakasu"
            mkdir -p "$cache"
            kernel_dir="$cache/kernel-tree-${GITHUB_REF_NAME//\//-}$SFX"
          else
            kernel_dir="$work/kernel"
          fi
          {
            echo "BUILD_WORK=$work"
            echo "KERNEL_DIR=$kernel_dir"
            echo "OUT_DIR=$work/out"
            echo "INFO_DIR=$work/info"
            echo "PACKAGE_DIR=$work/package"
            echo "TOOLCHAIN=$RUNNER_TEMP/aosp-clang14"
            echo "BUILD_LOG=$work/build.log"
          } >> "$GITHUB_ENV"
          mkdir -p "$work/package"
          df -h "$RUNNER_TEMP"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          packages=(bc binutils-aarch64-linux-gnu bison pahole build-essential ca-certificates cpio curl file flex git libelf-dev libssl-dev libncurses-dev lz4 patch python3 unzip xz-utils zip zlib1g-dev zstd util-linux)
          if [[ "$SELF_HOSTED" != true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
            exit 0
          fi
          fail() { echo "::error::$*" >&2; exit 1; }
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then
              sudo -n true || fail "Missing packages (run: sudo apt install ${missing[*]})"
              privilege=(sudo -n)
            fi
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends --no-remove "${missing[@]}"
          else
            echo 'All build dependencies are already installed.'
          fi

      - name: Use cached toolchain (own PC)
        if: env.SELF_HOSTED == 'true'
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel/xxksu"
          mkdir -p "$cache"
          exec 9>"$cache/.lock"
          flock 9
          . scripts/sources.conf
          if [[ "${KERNEL_TOOLCHAIN:-aosp}" == zyc ]]; then
            key=$(sha256sum scripts/fetch_zyc_clang.sh scripts/zyc_clang14.conf | sha256sum | cut -c1-16)
            toolchain="$cache/zyc-clang14-$key"
            ZYC_CLANG_CACHE="$cache/archives" bash scripts/fetch_zyc_clang.sh "$toolchain"
          else
            key=$(sha256sum scripts/fetch_aosp_clang.sh scripts/aosp_clang14.conf | sha256sum | cut -c1-16)
            toolchain="$cache/aosp-clang14-$key"
            AOSP_CLANG_CACHE="$cache/archives" sh scripts/fetch_aosp_clang.sh "$toolchain"
          fi
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Download sources and apply patches
        env:
          # A module-only build needs the kernel exactly as it was, with NoMount separate.
          NOMOUNT_MODE: ${{ env.BUILD_KERNEL == 'true' && env.NOMOUNT_MODE || 'lkm' }}
        run: |
          set -euo pipefail
          bash scripts/prepare_sources.sh 2>&1 | tee "$BUILD_LOG"
          python3 - <<'EOF'
          import json, os, subprocess
          p = os.path.join(os.environ["INFO_DIR"], "sources.json")
          d = json.load(open(p))
          d["build_repo"] = {
              "repo": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}",
              "ref": os.environ["GITHUB_REF_NAME"], "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "subject": subprocess.check_output(["git", "show", "-s", "--format=%s", "HEAD"], text=True).strip(),
          }
          json.dump(d, open(p, "w"), indent=2)
          EOF

      - name: Download the kernel kit
        if: env.KIT_ID != ''
        run: |
          set -euo pipefail
          python3 scripts/kernel_kit.py download "$KIT_ID" "$BUILD_WORK/kit"
          echo "KIT_DIR=$BUILD_WORK/kit" >> "$GITHUB_ENV"

      - name: Compile kernel
        if: env.KIT_ID == ''
        run: |
          set -euo pipefail
          bash scripts/build_kernel.sh 2>&1 | tee -a "$BUILD_LOG"

      - name: Make flashable ZIP
        id: package
        if: env.BUILD_KERNEL == 'true'
        run: |
          set -euo pipefail
          bash scripts/package_zip.sh 2>&1 | tee -a "$BUILD_LOG"
          name=$(cat "$PACKAGE_DIR/zip-name.txt")
          echo "ZIP_PATH=$PACKAGE_DIR/$name.zip" >> "$GITHUB_ENV"
          if [[ -f "$PACKAGE_DIR/zip-name-valhall.txt" ]]; then
            echo "VALHALL_ZIP_PATH=$PACKAGE_DIR/$(cat "$PACKAGE_DIR/zip-name-valhall.txt").zip" >> "$GITHUB_ENV"
            echo "### Flashable ZIP with the Valhall GPU drivers: \`$(cat "$PACKAGE_DIR/zip-name-valhall.txt").zip\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Unarchived uploads are named after the file: give the Aigis copies their own names.
          cp "$PACKAGE_DIR/build-info.txt" "$BUILD_WORK/build-info$SFX.txt"
          echo "INFO_FILE=$BUILD_WORK/build-info$SFX.txt" >> "$GITHUB_ENV"
          {
            echo "### Flashable ZIP: \`$name.zip\`"
            echo '```'
            cat "$PACKAGE_DIR/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the kernel kit (for NoMount builds without a kernel compile)
        if: env.BUILD_KERNEL == 'true'
        run: |
          set -euo pipefail
          kit="$BUILD_WORK/kit-out"
          mkdir -p "$kit"
          cp "$OUT_DIR/.config" "$OUT_DIR/Module.symvers" "$kit/"
          cp "$OUT_DIR/include/config/kernel.release" "$kit/kernel.release"
          commit() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]]['commit'])" "$INFO_DIR/sources.json" "$1"; }
          KERNEL_REF=$(commit kernel); KSU_REF=$(commit xxksu); SUSFS_REF=$(commit susfs)
          export KERNEL_REF KSU_REF SUSFS_REF
          part=separate
          # A kernel with NoMount built in is a different kernel: own kit key.
          [[ "$NOMOUNT_MODE" != integrate ]] || part="integrate@$(commit nomount)"
          k=$(NOMOUNT_PART=$part python3 scripts/kernel_kit.py key)
          echo "Kernel kit key: $k"
          echo "KIT_NAME=kernel-kit-$k" >> "$GITHUB_ENV"
          echo "KIT_OUT=$kit" >> "$GITHUB_ENV"

      - name: Set up Zig (NoMount)
        if: env.BUILD_NOMOUNT == 'true'
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Build the NoMount ${{ env.NOMOUNT_REF }} module
        if: env.BUILD_NOMOUNT == 'true'
        run: |
          set -euo pipefail
          # Same commits and settings as the kernel. Either the kernel
          # compiled in this job, or the saved kernel kit of that kernel.
          if [[ -n "${KIT_DIR:-}" ]]; then
            NOMOUNT_KIT=$KIT_DIR bash scripts/build_nomount.sh "$PACKAGE_DIR/nomount" 2>&1 | tee -a "$BUILD_LOG"
          else
            NOMOUNT_REUSE_BUILD=true bash scripts/build_nomount.sh "$PACKAGE_DIR/nomount" 2>&1 | tee -a "$BUILD_LOG"
          fi
          ls -l "$PACKAGE_DIR/nomount"
          echo "NM_ZIP=$(ls "$PACKAGE_DIR"/nomount/NoMount-*.zip)" >> "$GITHUB_ENV"
          echo "NM_KO=$PACKAGE_DIR/nomount/nomount-4.14-$KERNEL_SOURCE.ko" >> "$GITHUB_ENV"

      - name: Put the NoMount module into the flashable ZIP (installed by TWRP)
        if: env.BUILD_KERNEL == 'true' && env.BUILD_NOMOUNT == 'true' && env.NOMOUNT_MODE == 'lkm'
        run: |
          set -euo pipefail
          bash scripts/bundle_nomount.sh "$ZIP_PATH" "$NM_ZIP" "$PACKAGE_DIR/build-info.txt" "$INFO_FILE" 2>&1 | tee -a "$BUILD_LOG"
          (cd "$PACKAGE_DIR" && sha256sum "$(basename "$ZIP_PATH")" > SHA256SUMS.txt)

      - name: Check the module matches the promoted kernel
        if: env.BUILD_KERNEL != 'true' && matrix.kernel_release != ''
        env:
          WANT_RELEASE: ${{ matrix.kernel_release }}
        run: |
          set -euo pipefail
          got=$(cat "$OUT_DIR/include/config/kernel.release")
          echo "Kernel release here: $got, promoted kernel: $WANT_RELEASE"
          [[ "$got" == "$WANT_RELEASE" ]] || { echo "::error::Kernel release differs from the promoted kernel."; exit 1; }

      - name: Upload flashable ZIP
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload flashable ZIP with the Valhall GPU drivers
        if: env.BUILD_KERNEL == 'true' && env.VALHALL_ZIP_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.VALHALL_ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build-info${{ env.SFX }}.txt
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.INFO_FILE }}
          archive: false
          retention-days: 30

      - name: Upload NoMount module ZIP
        if: env.BUILD_NOMOUNT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NM_ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload nomount-4.14-${{ matrix.source }}.ko
        if: env.BUILD_NOMOUNT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NM_KO }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload the kernel kit
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.KIT_NAME }}
          path: ${{ env.KIT_OUT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Keep files for the release job and a later Promoted run
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-files${{ env.SFX }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.VALHALL_ZIP_PATH }}
            ${{ env.PACKAGE_DIR }}/build-info.txt
            ${{ env.PACKAGE_DIR }}/sources.json
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
            ${{ env.PACKAGE_DIR }}/nomount/
          retention-days: 30

      - name: Keep the NoMount files for the promoted build
        if: env.BUILD_KERNEL != 'true' && (inputs.commit_mode == 'Promoted' || inputs.reuse != '')
        uses: actions/upload-artifact@v7
        with:
          name: promoted-nomount-${{ matrix.source }}
          path: ${{ env.PACKAGE_DIR }}/nomount/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}${{ env.SFX }}
          include-hidden-files: true
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.OUT_DIR }}/System.map
            ${{ env.OUT_DIR }}/toolchain-source.txt
            ${{ env.INFO_DIR }}/sources.json
            ${{ env.INFO_DIR }}/applied-patches.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build folder (own PC)
        if: always() && env.SELF_HOSTED == 'true'
        run: |
          if [[ -n "${BUILD_WORK:-}" && "$BUILD_WORK" == "$RUNNER_TEMP"/a325x-build.* ]]; then
            rm -rf -- "$BUILD_WORK"
          fi

  collect:
    name: Collect the files of an earlier run
    needs: [pick, build]
    # Promoted, or the kernels the Upstream check keeps from an earlier run.
    if: ${{ !cancelled() && !failure() && needs.pick.outputs.collect_sources != '' }}
    runs-on: ubuntu-latest
    env:
      SOURCES: ${{ needs.pick.outputs.collect_sources }}
      RUNS: ${{ needs.pick.outputs.collect_runs }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/promoted_source.py
          sparse-checkout-cone-mode: false
      - name: Download the files of the earlier run
        run: |
          set -euo pipefail
          for src in $SOURCES; do
            ONLY=$src python3 scripts/promoted_source.py download "$(jq -r --arg s "$src" '.[$s]' <<<"$RUNS")" source
          done
      - name: Download the NoMount modules built now
        if: needs.pick.outputs.build_any == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: promoted-nomount-*
          path: promoted
      - name: Put the files together
        run: |
          set -euo pipefail
          for src in $SOURCES; do
            if [[ -d "promoted/promoted-nomount-$src" ]]; then
              # Only the module built now, not the one of the Latest run.
              find "source/$src" -path '*/nomount/*' -type f -delete
            fi
            if [[ -d "promoted/promoted-nomount-$src" ]]; then
              mkdir -p "source/$src/promoted"
              mv "promoted/promoted-nomount-$src" "source/$src/promoted/nomount"
            fi
            python3 scripts/promoted_source.py collect "source/$src" "release/$src"
            if [[ "$NOMOUNT_MODE" == lkm ]]; then
              ls "release/$src"/nomount/*.ko "release/$src"/nomount/NoMount-*.zip >/dev/null \
                || { echo "::error::No NoMount module for the promoted $src build."; exit 1; }
            fi
            run=$(jq -r --arg s "$src" '.[$s]' <<<"$RUNS")
            echo "${{ inputs.commit_mode == 'Promoted' && 'Promoted' || 'Kernel ZIP taken' }} from: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" >> "release/$src/build-info.txt"
          done
      - name: Keep the Aigis BakaSU files for the release job
        if: contains(format(' {0} ', needs.pick.outputs.collect_sources), ' aigis-bakasu ')
        uses: actions/upload-artifact@v7
        with:
          name: release-files-aigis-bakasu
          path: release/aigis-bakasu/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release and update README
    needs: [pick, manager, build, collect]
    if: ${{ !cancelled() && !failure() && inputs.release_type != 'CI' && inputs.release_type != 'Release from pre-release' && (inputs.commit_mode != 'Promoted' || needs.pick.outputs.promote_ok == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.ref_name }}
      SOURCES: ${{ needs.pick.outputs.sources }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Check the release is allowed
        run: |
          set -euo pipefail
          if [[ "${{ inputs.release_type }}" == Release && "${{ inputs.commit_mode }}" != Verified ]]; then
            echo "::error::Release must use Verified. Latest and Promoted can publish a Pre-release, which can then become the full Release with 'Release from pre-release'."
            exit 1
          fi
          echo "Publishing a ${{ inputs.release_type }} from commit mode ${{ inputs.commit_mode }}."

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-files*
          path: files

      - name: Download ${{ needs.manager.outputs.bakasu_apk }}
        if: needs.manager.outputs.bakasu_apk != ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.manager.outputs.bakasu_apk }}
          path: release

      - name: Download manager-bakasu.json
        if: needs.manager.outputs.bakasu_apk != ''
        uses: actions/download-artifact@v8
        with:
          name: bakasu-manager-info
          path: release

      - name: Put all files of every kernel together
        run: |
          set -euo pipefail
          ls -lR files
          shopt -s nullglob
          mkdir -p release
          # The kernel keeps the plain names (build-info.txt, sources.json).
          # NoMount files always name their kernel.
          plain=${SOURCES%% *}
          for src in $SOURCES; do
            sfx=
            [[ $src == "$plain" ]] || sfx=-$src
            d=files/release-files-$src
            [[ -d "$d" ]] || { echo "::error::No release files for the $src kernel."; exit 1; }
            files=("$d"/nomount/*)
            if [[ "$NOMOUNT_MODE" == lkm ]]; then
              ((${#files[@]})) || { echo "::error::The NoMount module of the $src kernel was not built."; exit 1; }
            fi
            if [[ "$NOMOUNT_MODE" == lkm ]]; then
              # Every kernel ZIP carries the NoMount module built for it.
              nmz=("$d"/nomount/NoMount-*.zip)
              ((${#nmz[@]} == 1)) || { echo "::error::Expected one NoMount ZIP for the $src kernel, found ${#nmz[@]}."; exit 1; }
              for kz in "$d"/*.zip; do
                bash scripts/bundle_nomount.sh "$kz" "${nmz[0]}" "$d/build-info.txt"
              done
            fi
            for f in "${files[@]}"; do
              n=$(basename "$f")
              # Older runs: nomount-4.14.ko without the kernel in the name.
              [[ "$n" == *.ko && "$n" != *-"$src".ko ]] && n="${n%.ko}-$src.ko"
              [[ "$n" == NoMount-*.zip && "$n" != *-"$src"-* ]] && n="${n/-lkm-4.14-/-lkm-4.14-$src-}"
              mv "$f" "release/$n"
            done
            mv "$d"/*.zip release/
            mv "$d/build-info.txt" "release/build-info$sfx.txt"
            mv "$d/sources.json" "release/sources$sfx.json"
          done
          if [[ -n "${{ needs.pick.outputs.bakasu_ref }}" ]]; then
            apk="${{ needs.manager.outputs.bakasu_apk }}"
            [[ -n "$apk" && -f "release/$apk" ]] || { echo "::error::No BakaSU manager APK ($apk)."; exit 1; }
            [[ "$(sha256sum "release/$apk" | cut -d' ' -f1)" == "$(jq -r .sha256 release/manager-bakasu.json)" ]] \
              || { echo "::error::$apk does not match manager-bakasu.json."; exit 1; }
          fi
          (cd release && sha256sum -- *.zip *.ko *.apk > SHA256SUMS.txt)
          ls -l release

      - name: Write release notes
        run: |
          set -euo pipefail
          ls -l release
          # main: build-YYYYMMDD-N. Other branches: <branch>-YYYYMMDD-N (pre-release),
          # so every branch has its own release history and "what's new".
          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then prefix=build; else prefix=${BRANCH//\//-}; fi
          tag="$prefix-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          scripts/release_body.sh release "$prefix" "${{ inputs.release_type }}" "$tag" notes.md
          # Full Release: also ready-to-paste XDA posts #2 (changelog) and #3 (updates), BBCode.
          if [[ "${{ inputs.release_type }}" == Release ]]; then
            python3 scripts/xda_posts.py notes.md "$tag" \
              "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$tag" "release/XDA-posts-$tag.txt"
          fi

      - name: Publish release
        run: |
          set -euo pipefail
          # Title: the name of the kernel ZIP (without -valhall).
          name=
          for z in release/A325X-*.zip; do
            b=$(basename "$z" .zip); name=${b%-valhall}; break
          done
          [[ -n "$name" ]] || { echo "::error::No kernel ZIP in the release."; exit 1; }
          shopt -s nullglob
          assets=(release/*.zip release/*.ko release/*.apk release/build-info*.txt release/sources*.json release/SHA256SUMS.txt release/XDA-posts-*.txt)
          # Create the tag first, then the release without --target. With --target,
          # GitHub wants the "workflows" permission (which this token cannot get)
          # when workflow files changed on the branch after this commit: HTTP 403
          # "Resource not accessible by integration" (cli/cli#9514).
          if ! gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null; then
            have=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)
            [[ "$have" == "$GITHUB_SHA" ]] || { echo "::error::Tag $TAG already exists at $have."; exit 1; }
          fi
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$name" --notes-file notes.md \
            $([[ "${{ inputs.release_type }}" == Release ]] || echo --prerelease)

      - name: Update README sources table
        if: inputs.release_type == 'Release'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            python3 scripts/release_notes.py readme README.md "$TAG" release/sources*.json
            if git diff --quiet; then echo 'README already up to date.'; exit 0; fi
            git commit -q -am "README: sources for release $TAG"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not push the README update.'; exit 1

  publish_prerelease:
    name: Publish the last pre-release as Release
    needs: pick
    if: inputs.release_type == 'Release from pre-release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.ref_name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Find the pre-release
        env:
          WANT: ${{ inputs.pre_release }}
        run: |
          set -euo pipefail
          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then prefix=build; else prefix=${BRANCH//\//-}; fi
          echo "PREFIX=$prefix" >> "$GITHUB_ENV"
          if [[ -n "$WANT" ]]; then
            tag=$WANT
            pre=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease 2>/dev/null) \
              || { echo "::error::No release with the tag $tag."; exit 1; }
            [[ "$pre" == true ]] || { echo "::error::$tag is already a full Release."; exit 1; }
          else
            tag=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName,isPrerelease \
              --jq "[.[] | select(.isPrerelease) | .tagName | select(test(\"^$prefix-[0-9]{8}-[0-9]+\$\"))][0] // \"\"")
            [[ -n "$tag" ]] || { echo "::error::No pre-release on $BRANCH to publish. Run Build Kernel with release type Pre-release first."; exit 1; }
          fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Pre-release: $tag ($(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json name --jq .name))"
          mkdir release
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --dir release --pattern 'sources*.json' --pattern 'build-info*.txt'
          # Only the names of the ZIPs are needed for the notes.
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name | select(endswith(".zip") or endswith(".apk"))' \
            | while read -r n; do : > "release/$n"; done
          ls -l release
          # The release notes and README table are made for the BakaSU build.
          ls release/A325X-Aigis-BakaSU-*.zip >/dev/null 2>&1 \
            || { echo "::error::$tag has no BakaSU kernel ZIP (made before the switch to BakaSU on 23 Nov 2026), so it cannot be published from main."; exit 1; }

      - name: Compare with the Verified commits (information only)
        run: python3 scripts/check_verified.py --report configs/verified.json release/sources*.json

      - name: Write release notes and publish
        run: |
          set -euo pipefail
          scripts/release_body.sh release "$PREFIX" Release "$TAG" notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --notes-file notes.md
          python3 scripts/xda_posts.py notes.md "$TAG" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG" "XDA-posts-$TAG.txt"
          gh release upload "$TAG" "XDA-posts-$TAG.txt" --repo "$GITHUB_REPOSITORY" --clobber
          echo "### Published $TAG as the full Release" >> "$GITHUB_STEP_SUMMARY"
          echo "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json url --jq .url)" >> "$GITHUB_STEP_SUMMARY"

      - name: Update README sources table
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            python3 scripts/release_notes.py readme README.md "$TAG" release/sources*.json
            if git diff --quiet; then echo 'README already up to date.'; exit 0; fi
            git commit -q -am "README: sources for release $TAG"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not push the README update.'; exit 1

  promote:
    name: Save verified commits
    needs: [pick, collect]
    if: ${{ !cancelled() && !failure() && needs.pick.outputs.promote_ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download the promoted sources
        uses: actions/download-artifact@v8
        with:
          pattern: release-files*
          path: files

      - name: Pin the commits that built
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            SOURCE_RUN_URL="${{ needs.pick.outputs.source_url }}" \
              python3 scripts/resolve_commits.py promote configs/verified.json files/release-files*/sources.json
            if git diff --quiet; then echo 'Verified commits already match this build.'; exit 0; fi
            git commit -q -am "Verified commits: promote run ${GITHUB_RUN_NUMBER}"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not save the verified commits.'; exit 1
