name: Build Kernel
run-name: ${{ inputs.commit_mode == 'Promoted' && 'A325X promote the newest default Latest build' || (inputs.nomount_only && format('A325X NoMount {0} LKM only', inputs.nomount_branch) || 'A325X xxKSU + SUSFS kernel') }}${{ inputs.kernel_source == 'aigis' && ' (Aigis)' || (inputs.kernel_source == 'both' && ' (mzggr + Aigis)' || '') }}${{ inputs.commit_mode != 'Promoted' && format(' [{0}]', inputs.ksu_hook) || '' }}${{ inputs.commit_mode != 'Promoted' && inputs.perf_tuning && inputs.kernel_source != 'aigis' && ' (tuning)' || '' }}${{ inputs.commit_mode != 'Promoted' && !inputs.network_fix && ' (no network fix)' || '' }}${{ inputs.commit_mode != 'Promoted' && inputs.kernel_source != 'mzggr' && inputs.valhall_gpu && ' (Valhall GPU)' || '' }}${{ inputs.commit_mode != 'Promoted' && inputs.kernel_source != 'mzggr' && inputs.compiler == 'main' && ' (main compiler)' || '' }} (${{ inputs.commit_mode }})${{ inputs.nomount == 'no' && ' no NoMount' || format(' NoMount {0}-{1}', inputs.nomount, inputs.nomount_branch) }}${{ inputs.release_type != 'CI' && format(' + {0}', inputs.release_type) || '' }}${{ github.ref_name != 'main' && format(' [{0}]', github.ref_name) || '' }}

# Run it: Actions -> Build Kernel -> Run workflow.
# Every source (kernel, xxKSU, SUSFS patch, NoMount) is downloaded fresh during the run.
on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel. mzggr = mzggr0914 kernel (default). aigis = Aigis kernel by SlamZDank. both = build both (all ZIPs, one release)'
        type: choice
        options:
          - mzggr
          - aigis
          - both
        default: aigis
      self_hosted:
        description: 'Prefer my own PC (self-hosted). If it is busy, a GitHub runner is used when that finishes sooner. Untick = GitHub runner'
        type: boolean
        default: true
      ksu_hook:
        description: 'xxKSU hook. manual = default. branch_link is currently unstable'
        type: choice
        options:
          - manual
          - syscall_table
          - branch_link
        default: manual
      perf_tuning:
        description: 'Performance tuning, mzggr kernel only (Aigis keeps its own tuning, ignored there): GPU 1100 MHz, CPU/CCI undervolt, BORE, 250 Hz, schedutil, fast charge, zstd zram, BBR, fq_codel'
        type: boolean
        default: true
      network_fix:
        description: 'Network fix (UDP-only GSO for IPv4 and IPv6). Allowed with every release type'
        type: boolean
        default: true
      uname_tag:
        description: 'Text added to the end of uname -r on both kernels (letters, digits, space, . _ + -; no /). Empty = none'
        type: string
        default: '-forkby-gh.Najip'
      valhall_gpu:
        description: 'Aigis only: Valhall GPU, default ticked and allowed with every release type (Aigis r32p1 GPU code, r32p1 dtb in the zip, extra -valhall zip with the drivers module). Unticked = stock A32 GPU'
        type: boolean
        default: true
      compiler:
        description: 'Aigis only: compiler. aigis = ZyC Clang 14.0.6 the Aigis CI way (default). main = AOSP Clang 14 as used for mzggr'
        type: choice
        options:
          - aigis
          - main
        default: aigis
      nomount:
        description: 'NoMount. lkm = separate module (ZIP + .ko) built for this kernel (default). integrate = built into the kernel. no = not included'
        type: choice
        options:
          - lkm
          - integrate
          - 'no'
        default: lkm
      nomount_branch:
        description: 'NoMount branch'
        type: choice
        options:
          - dev
          - master
        default: dev
      nomount_only:
        description: 'Build only the NoMount module (no kernel ZIP). Uses the saved kernel kit of the same kernel when there is one, otherwise compiles the kernel to match it'
        type: boolean
        default: false
      commit_mode:
        description: 'Which commits to use. Latest = newest of every source (testing). Verified = the pinned commits saved by Promoted (required for a full Release). Promoted = no kernel rebuild: take the newest Latest run with the default kernel options and save its commits as Verified'
        type: choice
        options:
          - Latest
          - Verified
          - Promoted
        default: Latest
      release_type:
        description: 'CI = build only, no release. Pre-release = publish as a pre-release. Release = publish a full release (only allowed with Verified) and update the README sources table'
        type: choice
        options:
          - CI
          - Pre-release
          - Release
        default: CI
      bench_tool:
        description: 'Also build the hook benchmark tool (hook-bench artifact). Not needed to use the kernel'
        type: boolean
        default: false

permissions:
  contents: read
  actions: read


env:
  KERNEL_CHOICE: ${{ inputs.kernel_source || 'mzggr' }}
  # sources.conf ignores tuning for Aigis (it keeps its own tuning).
  PERF_TUNING: ${{ inputs.perf_tuning }}
  VALHALL_GPU: ${{ inputs.valhall_gpu }}
  AIGIS_COMPILER: ${{ inputs.compiler || 'aigis' }}
  NETWORK_FIX: ${{ inputs.network_fix }}
  KERNEL_TAG: ${{ inputs.uname_tag }}
  KSU_HOOK: ${{ inputs.ksu_hook || 'manual' }}
  NOMOUNT_MODE: ${{ inputs.nomount || 'lkm' }}
  NOMOUNT_REF: ${{ inputs.nomount_branch || 'dev' }}
  GH_TOKEN: ${{ github.token }}

jobs:
  pick:
    name: Pick runner
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: |
            scripts/pick_runner.py
            scripts/plan_build.py
            scripts/resolve_commits.py
            scripts/promoted_source.py
            scripts/kernel_kit.py
            scripts/sources.conf
            configs/verified.json
          sparse-checkout-cone-mode: false
      - name: Check the options fit together
        env:
          MODE: ${{ inputs.commit_mode }}
          TYPE: ${{ inputs.release_type }}
          NM_ONLY: ${{ inputs.nomount_only }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          if [[ "$TYPE" == Release && "$MODE" != Verified ]]; then
            fail "Release must use Verified. Latest and Promoted can only publish a Pre-release. Choose commit mode Verified, or pick Pre-release."
          fi
          if [[ "$PERF_TUNING" == true && "$KERNEL_CHOICE" != mzggr ]]; then
            echo "::warning title=Tuning ignored for Aigis::Performance tuning is for the mzggr kernel only. The Aigis kernel is built without it (Aigis keeps its own tuning)."
          fi
          if [[ "$NM_ONLY" == true ]]; then
            [[ "$NOMOUNT_MODE" == lkm ]] || fail "NoMount only needs the NoMount option lkm."
            [[ "$TYPE" == CI ]] || fail "NoMount only builds are not released. Choose CI."
            [[ "$MODE" != Promoted ]] || fail "NoMount only does not work with Promoted (Promoted already builds the module when it is missing)."
          fi
          if [[ "$MODE" == Promoted && "$NOMOUNT_MODE" == integrate ]]; then
            fail "Promoted takes the kernel of a default Latest build, where NoMount is a separate LKM. Choose lkm or no."
          fi
          echo "Options are fine."
      - name: Choose self-hosted PC or GitHub runner
        id: pick
        env:
          WANT_SELF_HOSTED: ${{ inputs.self_hosted }}
        run: python3 scripts/pick_runner.py
      - name: Decide what to build
        id: plan
        env:
          COMMIT_MODE: ${{ inputs.commit_mode }}
          NM_ONLY: ${{ inputs.nomount_only }}
          BRANCH: ${{ github.ref_name }}
        run: python3 scripts/plan_build.py
    outputs:
      runner: ${{ steps.pick.outputs.runner }}
      matrix: ${{ steps.plan.outputs.matrix }}
      build_any: ${{ steps.plan.outputs.build_any }}
      build_kernel: ${{ steps.plan.outputs.build_kernel }}
      promote_ok: ${{ steps.plan.outputs.promote_ok }}
      sources: ${{ steps.plan.outputs.sources }}
      source_run: ${{ steps.plan.outputs.source_run }}
      source_url: ${{ steps.plan.outputs.source_url }}
      checkout_sha: ${{ steps.plan.outputs.checkout_sha }}

  build:
    name: ${{ matrix.source }} - ${{ needs.pick.outputs.build_kernel == 'true' && 'Build xxKSU + SUSFS kernel' || 'Build the NoMount module' }}
    needs: pick
    if: needs.pick.outputs.build_any == 'true'
    runs-on: ${{ needs.pick.outputs.runner }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.pick.outputs.matrix) }}
    env:
      SELF_HOSTED: ${{ needs.pick.outputs.runner == 'self-hosted' }}
      KERNEL_SOURCE: ${{ matrix.source }}
      # Artifact name suffix: none for mzggr (as before), -aigis for Aigis.
      SFX: ${{ matrix.source != 'mzggr' && format('-{0}', matrix.source) || '' }}
      # Promoted: same hook style and tuning as the Latest run it takes the kernel from.
      KSU_HOOK: ${{ matrix.ksu_hook }}
      PERF_TUNING: ${{ matrix.perf_tuning }}
      NETWORK_FIX: ${{ matrix.network_fix }}
      # Promoted: the Aigis GPU (Valhall or stock) of the Latest run.
      VALHALL_GPU: ${{ matrix.valhall_gpu }}
      # Promoted: the tag of the Latest run, so the module matches its kernel.
      KERNEL_TAG: ${{ matrix.kernel_tag }}
      BUILD_KERNEL: ${{ needs.pick.outputs.build_kernel }}
      BUILD_NOMOUNT: ${{ matrix.build_nomount }}
      KIT_ID: ${{ matrix.kit_id }}
      KERNEL_REF: ${{ matrix.kernel_ref }}
      KSU_REF: ${{ matrix.ksu_ref }}
      SUSFS_REF: ${{ matrix.susfs_ref }}
      KERNEL_BRANCH: ${{ matrix.kernel_branch }}
      KSU_BRANCH: ${{ matrix.ksu_branch }}
      SUSFS_BRANCH: ${{ matrix.susfs_branch }}
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Promoted: the same build-repo commit as the Latest run, so the module matches its kernel.
          ref: ${{ needs.pick.outputs.checkout_sha }}
          fetch-depth: 1

      - name: Prepare build folders
        run: |
          set -euo pipefail
          work=$(mktemp -d "$RUNNER_TEMP/a325x-build.XXXXXX")
          if [[ "$SELF_HOSTED" == true ]]; then
            # Keep the kernel download between runs on the PC (saves ~1 GB per run).
            cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325x-bakasu"
            mkdir -p "$cache"
            kernel_dir="$cache/kernel-tree-${GITHUB_REF_NAME//\//-}$SFX"
          else
            kernel_dir="$work/kernel"
          fi
          {
            echo "BUILD_WORK=$work"
            echo "KERNEL_DIR=$kernel_dir"
            echo "OUT_DIR=$work/out"
            echo "INFO_DIR=$work/info"
            echo "PACKAGE_DIR=$work/package"
            echo "TOOLCHAIN=$RUNNER_TEMP/aosp-clang14"
            echo "BUILD_LOG=$work/build.log"
          } >> "$GITHUB_ENV"
          mkdir -p "$work/package"
          df -h "$RUNNER_TEMP"

      - name: Install build dependencies
        run: |
          set -euo pipefail
          packages=(bc binutils-aarch64-linux-gnu bison pahole build-essential ca-certificates cpio curl file flex git libelf-dev libssl-dev libncurses-dev lz4 patch python3 unzip xz-utils zip zlib1g-dev zstd util-linux)
          if [[ "$SELF_HOSTED" != true ]]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends "${packages[@]}"
            exit 0
          fi
          fail() { echo "::error::$*" >&2; exit 1; }
          missing=()
          for package in "${packages[@]}"; do
            status=$(dpkg-query -W -f='${Status}' "$package" 2>/dev/null || true)
            [[ "$status" == 'install ok installed' ]] || missing+=("$package")
          done
          if ((${#missing[@]})); then
            privilege=()
            if ((EUID != 0)); then
              sudo -n true || fail "Missing packages (run: sudo apt install ${missing[*]})"
              privilege=(sudo -n)
            fi
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 update
            "${privilege[@]}" env DEBIAN_FRONTEND=noninteractive apt-get -o DPkg::Lock::Timeout=300 install -y --no-install-recommends --no-remove "${missing[@]}"
          else
            echo 'All build dependencies are already installed.'
          fi

      - name: Use cached toolchain (own PC)
        if: env.SELF_HOSTED == 'true'
        run: |
          set -euo pipefail
          cache="${XDG_CACHE_HOME:-$HOME/.cache}/a325-kernel/xxksu"
          mkdir -p "$cache"
          exec 9>"$cache/.lock"
          flock 9
          . scripts/sources.conf
          if [[ "${KERNEL_TOOLCHAIN:-aosp}" == zyc ]]; then
            key=$(sha256sum scripts/fetch_zyc_clang.sh scripts/zyc_clang14.conf | sha256sum | cut -c1-16)
            toolchain="$cache/zyc-clang14-$key"
            ZYC_CLANG_CACHE="$cache/archives" bash scripts/fetch_zyc_clang.sh "$toolchain"
          else
            key=$(sha256sum scripts/fetch_aosp_clang.sh scripts/aosp_clang14.conf | sha256sum | cut -c1-16)
            toolchain="$cache/aosp-clang14-$key"
            AOSP_CLANG_CACHE="$cache/archives" sh scripts/fetch_aosp_clang.sh "$toolchain"
          fi
          echo "TOOLCHAIN=$toolchain" >> "$GITHUB_ENV"

      - name: Download sources and apply patches
        env:
          # A module-only build needs the kernel exactly as it was, with NoMount separate.
          NOMOUNT_MODE: ${{ env.BUILD_KERNEL == 'true' && env.NOMOUNT_MODE || 'lkm' }}
        run: |
          set -euo pipefail
          bash scripts/prepare_sources.sh 2>&1 | tee "$BUILD_LOG"
          python3 - <<'EOF'
          import json, os, subprocess
          p = os.path.join(os.environ["INFO_DIR"], "sources.json")
          d = json.load(open(p))
          d["build_repo"] = {
              "repo": f"{os.environ['GITHUB_SERVER_URL']}/{os.environ['GITHUB_REPOSITORY']}",
              "ref": os.environ["GITHUB_REF_NAME"], "commit": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "subject": subprocess.check_output(["git", "show", "-s", "--format=%s", "HEAD"], text=True).strip(),
          }
          json.dump(d, open(p, "w"), indent=2)
          EOF

      - name: Download the kernel kit
        if: env.KIT_ID != ''
        run: |
          set -euo pipefail
          python3 scripts/kernel_kit.py download "$KIT_ID" "$BUILD_WORK/kit"
          echo "KIT_DIR=$BUILD_WORK/kit" >> "$GITHUB_ENV"

      - name: Compile kernel
        if: env.KIT_ID == ''
        run: |
          set -euo pipefail
          bash scripts/build_kernel.sh 2>&1 | tee -a "$BUILD_LOG"

      - name: Make flashable ZIP
        id: package
        if: env.BUILD_KERNEL == 'true'
        run: |
          set -euo pipefail
          bash scripts/package_zip.sh 2>&1 | tee -a "$BUILD_LOG"
          name=$(cat "$PACKAGE_DIR/zip-name.txt")
          echo "ZIP_PATH=$PACKAGE_DIR/$name.zip" >> "$GITHUB_ENV"
          if [[ -f "$PACKAGE_DIR/zip-name-valhall.txt" ]]; then
            echo "VALHALL_ZIP_PATH=$PACKAGE_DIR/$(cat "$PACKAGE_DIR/zip-name-valhall.txt").zip" >> "$GITHUB_ENV"
            echo "### Flashable ZIP with the Valhall GPU drivers: \`$(cat "$PACKAGE_DIR/zip-name-valhall.txt").zip\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          # Unarchived uploads are named after the file: give the Aigis copies their own names.
          cp "$PACKAGE_DIR/build-info.txt" "$BUILD_WORK/build-info$SFX.txt"
          echo "INFO_FILE=$BUILD_WORK/build-info$SFX.txt" >> "$GITHUB_ENV"
          {
            echo "### Flashable ZIP: \`$name.zip\`"
            echo '```'
            cat "$PACKAGE_DIR/build-info.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Save the kernel kit (for NoMount builds without a kernel compile)
        if: env.BUILD_KERNEL == 'true'
        run: |
          set -euo pipefail
          kit="$BUILD_WORK/kit-out"
          mkdir -p "$kit"
          cp "$OUT_DIR/.config" "$OUT_DIR/Module.symvers" "$kit/"
          cp "$OUT_DIR/include/config/kernel.release" "$kit/kernel.release"
          commit() { python3 -c "import json,sys;print(json.load(open(sys.argv[1]))[sys.argv[2]]['commit'])" "$INFO_DIR/sources.json" "$1"; }
          KERNEL_REF=$(commit kernel); KSU_REF=$(commit xxksu); SUSFS_REF=$(commit susfs)
          export KERNEL_REF KSU_REF SUSFS_REF
          part=separate
          # A kernel with NoMount built in is a different kernel: own kit key.
          [[ "$NOMOUNT_MODE" != integrate ]] || part="integrate@$(commit nomount)"
          k=$(NOMOUNT_PART=$part python3 scripts/kernel_kit.py key)
          echo "Kernel kit key: $k"
          echo "KIT_NAME=kernel-kit-$k" >> "$GITHUB_ENV"
          echo "KIT_OUT=$kit" >> "$GITHUB_ENV"

      - name: Set up Zig (NoMount)
        if: env.BUILD_NOMOUNT == 'true'
        uses: jetsung/setup-zig@v0.0.4
        with:
          version: master

      - name: Build the NoMount ${{ env.NOMOUNT_REF }} module
        if: env.BUILD_NOMOUNT == 'true'
        run: |
          set -euo pipefail
          # Same commits, hook style and tuning as the kernel. Either the kernel
          # compiled in this job, or the saved kernel kit of that kernel.
          if [[ -n "${KIT_DIR:-}" ]]; then
            NOMOUNT_KIT=$KIT_DIR bash scripts/build_nomount.sh "$PACKAGE_DIR/nomount" 2>&1 | tee -a "$BUILD_LOG"
          else
            NOMOUNT_REUSE_BUILD=true bash scripts/build_nomount.sh "$PACKAGE_DIR/nomount" 2>&1 | tee -a "$BUILD_LOG"
          fi
          ls -l "$PACKAGE_DIR/nomount"
          echo "NM_ZIP=$(ls "$PACKAGE_DIR"/nomount/NoMount-*.zip)" >> "$GITHUB_ENV"
          cp "$PACKAGE_DIR/nomount/nomount-4.14.ko" "$BUILD_WORK/nomount-4.14$SFX.ko"
          echo "NM_KO=$BUILD_WORK/nomount-4.14$SFX.ko" >> "$GITHUB_ENV"

      - name: Check the module matches the promoted kernel
        if: env.BUILD_KERNEL != 'true' && matrix.kernel_release != ''
        env:
          WANT_RELEASE: ${{ matrix.kernel_release }}
        run: |
          set -euo pipefail
          got=$(cat "$OUT_DIR/include/config/kernel.release")
          echo "Kernel release here: $got, promoted kernel: $WANT_RELEASE"
          [[ "$got" == "$WANT_RELEASE" ]] || { echo "::error::Kernel release differs from the promoted kernel."; exit 1; }

      - name: Build hook benchmark
        if: inputs.bench_tool && env.BUILD_KERNEL == 'true' && matrix.first == 'true'
        run: |
          set -euo pipefail
          mkdir -p "$BUILD_WORK/bench"
          "$TOOLCHAIN/bin/clang" --target=aarch64-linux-gnu -O2 -static -nostdlib -ffreestanding \
            -fno-stack-protector -fno-builtin -fno-pic -fuse-ld=lld -Wl,--build-id=none -Wl,-z,norelro \
            -o "$BUILD_WORK/bench/hook-bench" tools/hook-bench.c
          cp tools/hook-bench.sh "$BUILD_WORK/bench/"
          echo "BENCH_DIR=$BUILD_WORK/bench" >> "$GITHUB_ENV"

      - name: Upload flashable ZIP
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload flashable ZIP with the Valhall GPU drivers
        if: env.BUILD_KERNEL == 'true' && env.VALHALL_ZIP_PATH != ''
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.VALHALL_ZIP_PATH }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload build-info${{ env.SFX }}.txt
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.INFO_FILE }}
          archive: false
          retention-days: 30

      - name: Upload NoMount module ZIP
        if: env.BUILD_NOMOUNT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NM_ZIP }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload nomount-4.14${{ env.SFX }}.ko
        if: env.BUILD_NOMOUNT == 'true'
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.NM_KO }}
          archive: false
          if-no-files-found: error
          retention-days: 30

      - name: Upload hook benchmark
        if: inputs.bench_tool && env.BUILD_KERNEL == 'true' && matrix.first == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: hook-bench
          path: ${{ env.BENCH_DIR }}
          retention-days: 30

      - name: Upload the kernel kit
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.KIT_NAME }}
          path: ${{ env.KIT_OUT }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

      - name: Keep files for the release job and a later Promoted run
        if: env.BUILD_KERNEL == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-files${{ env.SFX }}
          path: |
            ${{ env.ZIP_PATH }}
            ${{ env.VALHALL_ZIP_PATH }}
            ${{ env.PACKAGE_DIR }}/build-info.txt
            ${{ env.PACKAGE_DIR }}/sources.json
            ${{ env.PACKAGE_DIR }}/SHA256SUMS.txt
            ${{ env.PACKAGE_DIR }}/nomount/
          retention-days: 30

      - name: Keep the NoMount files for the promoted build
        if: env.BUILD_KERNEL != 'true' && inputs.commit_mode == 'Promoted'
        uses: actions/upload-artifact@v7
        with:
          name: promoted-nomount-${{ matrix.source }}
          path: ${{ env.PACKAGE_DIR }}/nomount/
          if-no-files-found: error
          retention-days: 30

      - name: Upload logs for troubleshooting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-logs-${{ github.run_number }}${{ env.SFX }}
          include-hidden-files: true
          path: |
            ${{ env.BUILD_LOG }}
            ${{ env.OUT_DIR }}/.config
            ${{ env.OUT_DIR }}/System.map
            ${{ env.OUT_DIR }}/toolchain-source.txt
            ${{ env.INFO_DIR }}/sources.json
            ${{ env.INFO_DIR }}/applied-patches.txt
          if-no-files-found: warn
          retention-days: 14

      - name: Clean build folder (own PC)
        if: always() && env.SELF_HOSTED == 'true'
        run: |
          if [[ -n "${BUILD_WORK:-}" && "$BUILD_WORK" == "$RUNNER_TEMP"/a325x-build.* ]]; then
            rm -rf -- "$BUILD_WORK"
          fi

  collect:
    name: Collect the promoted build
    needs: [pick, build]
    if: ${{ !cancelled() && !failure() && needs.pick.outputs.promote_ok == 'true' }}
    runs-on: ubuntu-latest
    env:
      SOURCES: ${{ needs.pick.outputs.sources }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          sparse-checkout: scripts/promoted_source.py
          sparse-checkout-cone-mode: false
      - name: Download the files of the Latest run
        run: python3 scripts/promoted_source.py download "${{ needs.pick.outputs.source_run }}" source
      - name: Download the NoMount modules built now
        if: needs.pick.outputs.build_any == 'true'
        uses: actions/download-artifact@v8
        with:
          pattern: promoted-nomount-*
          path: promoted
      - name: Put the files together
        run: |
          set -euo pipefail
          for src in $SOURCES; do
            if [[ -d "promoted/promoted-nomount-$src" || "$NOMOUNT_MODE" == no ]]; then
              # Only the module built now (or none), not the one of the Latest run.
              find "source/$src" -path '*/nomount/*' -type f -delete
            fi
            if [[ -d "promoted/promoted-nomount-$src" ]]; then
              mkdir -p "source/$src/promoted"
              mv "promoted/promoted-nomount-$src" "source/$src/promoted/nomount"
            fi
            python3 scripts/promoted_source.py collect "source/$src" "release/$src"
            if [[ "$NOMOUNT_MODE" == lkm ]]; then
              ls "release/$src"/nomount/*.ko "release/$src"/nomount/NoMount-*.zip >/dev/null \
                || { echo "::error::No NoMount module for the promoted $src build."; exit 1; }
            fi
            echo "Promoted from: ${{ needs.pick.outputs.source_url }}" >> "release/$src/build-info.txt"
          done
      - name: Keep the mzggr files for the release job
        if: contains(needs.pick.outputs.sources, 'mzggr')
        uses: actions/upload-artifact@v7
        with:
          name: release-files
          path: release/mzggr/
          if-no-files-found: error
          retention-days: 30
      - name: Keep the Aigis files for the release job
        if: contains(needs.pick.outputs.sources, 'aigis')
        uses: actions/upload-artifact@v7
        with:
          name: release-files-aigis
          path: release/aigis/
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish release and update README
    needs: [pick, build, collect]
    if: ${{ !cancelled() && !failure() && inputs.release_type != 'CI' && (inputs.commit_mode != 'Promoted' || needs.pick.outputs.promote_ok == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      BRANCH: ${{ github.ref_name }}
      SOURCES: ${{ needs.pick.outputs.sources }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Check the release is allowed
        run: |
          set -euo pipefail
          if [[ "${{ inputs.release_type }}" == Release && "${{ inputs.commit_mode }}" != Verified ]]; then
            echo "::error::Release must use Verified. Latest and Promoted can only publish a Pre-release. Choose commit mode Verified, or pick Pre-release."
            exit 1
          fi
          echo "Publishing a ${{ inputs.release_type }} from commit mode ${{ inputs.commit_mode }}."

      - name: Download release files
        uses: actions/download-artifact@v8
        with:
          pattern: release-files*
          path: files

      - name: Put all files of every kernel together
        run: |
          set -euo pipefail
          ls -lR files
          shopt -s nullglob
          mkdir -p release
          # The first kernel keeps the plain names (build-info.txt, sources.json,
          # nomount-4.14.ko); the second one gets -aigis.
          sfx=
          for src in $SOURCES; do
            d=files/release-files$([[ $src == mzggr ]] || echo "-$src")
            [[ -d "$d" ]] || { echo "::error::No release files for the $src kernel."; exit 1; }
            files=("$d"/nomount/*)
            if [[ "$NOMOUNT_MODE" == lkm ]]; then
              ((${#files[@]})) || { echo "::error::The NoMount module of the $src kernel was not built."; exit 1; }
            fi
            for f in "${files[@]}"; do
              n=$(basename "$f")
              [[ "$n" == *.ko ]] && n="${n%.ko}$sfx.ko"
              mv "$f" "release/$n"
            done
            mv "$d"/*.zip release/
            mv "$d/build-info.txt" "release/build-info$sfx.txt"
            mv "$d/sources.json" "release/sources$sfx.json"
            sfx=-aigis   # only Aigis can come second
          done
          (cd release && sha256sum -- *.zip *.ko > SHA256SUMS.txt)
          ls -l release

      - name: Write release notes
        run: |
          set -euo pipefail
          ls -l release
          # main: build-YYYYMMDD-N. Other branches: <branch>-YYYYMMDD-N (pre-release),
          # so every branch has its own release history and "what's new".
          if [[ "$BRANCH" == "$DEFAULT_BRANCH" ]]; then prefix=build; else prefix=${BRANCH//\//-}; fi
          tag="$prefix-$(date -u +%Y%m%d)-${GITHUB_RUN_NUMBER}"
          echo "TAG=$tag" >> "$GITHUB_ENV"
          prev=$(gh release list --repo "$GITHUB_REPOSITORY" --exclude-drafts --limit 100 --json tagName \
            --jq "[.[].tagName | select(test(\"^$prefix-[0-9]{8}-[0-9]+\$\"))][0] // \"\"")
          if [[ -n "$prev" ]] && gh release download "$prev" --repo "$GITHUB_REPOSITORY" --pattern sources.json --dir prev 2>/dev/null; then
            echo "Previous release: $prev"
            prev_json=prev/sources.json
          else
            echo "No previous release with sources.json; this is the first one."
            prev_json=-
          fi
          # Compare with the previous release only when it was built from the same kernel repo.
          if [[ "$prev_json" != - ]] && ! python3 -c 'import json,sys; a,b=(json.load(open(p))["kernel"]["repo"] for p in sys.argv[1:]); sys.exit(a!=b)' release/sources.json "$prev_json"; then
            echo "The previous release used another kernel; no what's new list."
            prev_json=-
          fi
          python3 scripts/release_notes.py notes release/sources.json "$prev_json" release/build-info.txt notes.md
          if [[ -f release/sources-aigis.json ]]; then
            {
              echo
              echo "## Kernels in this release"
              echo "Pick one kernel ZIP and flash it. NoMount: flash the NoMount ZIP made for that kernel."
              for z in release/*.zip; do
                n=$(basename "$z")
                case "$n" in
                  NoMount-*) ;;
                  *-Aigis-*-valhall.zip) echo "- \`$n\`: Aigis kernel with the Valhall GPU and its drivers module" ;;
                  *-Aigis-*) echo "- \`$n\`: Aigis kernel by SlamZDank (details: build-info-aigis.txt)" ;;
                  *) echo "- \`$n\`: mzggr0914 kernel (details: build-info.txt)" ;;
                esac
              done
              for z in release/NoMount-*.zip; do echo "- \`$(basename "$z")\`: NoMount module"; done
              echo
              echo "Aigis sources: $(python3 -c 'import json; d=json.load(open("release/sources-aigis.json")); print(d["kernel"]["repo"] + " @ " + d["kernel"]["commit"][:12])')"
            } >> notes.md
          fi

      - name: Publish release
        run: |
          set -euo pipefail
          # Title: the kernel ZIP of the first kernel.
          zips=(); for z in release/A325X-*.zip; do [[ "$z" == *-valhall.zip ]] || zips+=("$(basename "$z" .zip)"); done
          name=${zips[0]}
          for z in "${zips[@]}"; do [[ "$z" == *-Aigis-* ]] || name=$z; done
          if [[ -f release/sources-aigis.json ]]; then name="$name + Aigis"; fi
          shopt -s nullglob
          assets=(release/*.zip release/*.ko release/build-info*.txt release/sources*.json release/SHA256SUMS.txt)
          gh release create "$TAG" "${assets[@]}" \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "$name" --notes-file notes.md \
            $([[ "${{ inputs.release_type }}" == Release ]] || echo --prerelease)

      - name: Update README sources table
        if: inputs.release_type == 'Release'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            python3 scripts/release_notes.py readme release/sources.json README.md "$TAG"
            if git diff --quiet; then echo 'README already up to date.'; exit 0; fi
            git commit -q -am "README: sources for release $TAG"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not push the README update.'; exit 1

  promote:
    name: Save verified commits
    needs: [pick, collect]
    if: ${{ !cancelled() && !failure() && needs.pick.outputs.promote_ok == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BRANCH: ${{ github.ref_name }}
    steps:
      - name: Checkout ${{ github.ref_name }}
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1

      - name: Download the promoted sources
        uses: actions/download-artifact@v8
        with:
          pattern: release-files*
          path: files

      - name: Pin the commits that built
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3; do
            git fetch -q origin "$BRANCH" && git reset -q --hard FETCH_HEAD
            SOURCE_RUN_URL="${{ needs.pick.outputs.source_url }}" \
              python3 scripts/resolve_commits.py promote configs/verified.json files/release-files*/sources.json
            if git diff --quiet; then echo 'Verified commits already match this build.'; exit 0; fi
            git commit -q -am "Verified commits: promote run ${GITHUB_RUN_NUMBER}"
            git push -q origin "HEAD:$BRANCH" && exit 0
            sleep 5
          done
          echo '::error::Could not save the verified commits.'; exit 1
